name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fishkeeper

env:
  DATABASE_URL: file:./dummy.db

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fishkeeper/package-lock.json

      - run: npm ci
      - run: npm run lint

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fishkeeper/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fishkeeper/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fishkeeper/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: fishkeeper/.next/cache
          key: nextjs-${{ hashFiles('fishkeeper/package-lock.json') }}-${{ hashFiles('fishkeeper/**/*.ts', 'fishkeeper/**/*.tsx', '!fishkeeper/node_modules/**', '!fishkeeper/.next/**') }}
          restore-keys: nextjs-${{ hashFiles('fishkeeper/package-lock.json') }}-

      - run: npm run build