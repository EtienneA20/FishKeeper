name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fishkeeper

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fishkeeper/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: fishkeeper/.nvmrc
          cache: pnpm
          cache-dependency-path: fishkeeper/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: fishkeeper/.next/cache
          key: nextjs-${{ hashFiles('fishkeeper/pnpm-lock.yaml') }}-${{ hashFiles('fishkeeper/**/*.ts', 'fishkeeper/**/*.tsx', '!fishkeeper/node_modules/**', '!fishkeeper/.next/**') }}
          restore-keys: nextjs-${{ hashFiles('fishkeeper/pnpm-lock.yaml') }}-