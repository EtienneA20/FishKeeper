name: CI Validation

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Format Check
        run: npx prettier --check .

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint